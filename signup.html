<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KRONOS - SignUp</title>
        <script src="https://kit.fontawesome.com/d7017b0a4b.js" crossorigin="anonymous"></script>
        <link href="css/login.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
        <link rel="stylesheet" href="css/responsive.css">
    </head>

    <body>
        <header>

        <!-- Logo -->

        <img src="images/logo.png" alt="KRONOS Logo" class="logo" height="90px" width="220px">

        <!-- Navigation -->

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="Login.html" class="active">
                Account
            </a>

            <a href="wishlist.html">
                Wishlist
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="track.html">
                Track Order
            </a>

            <a href="faq.html">
                FAQ's
            </a>
        </nav>

    </header>


    <!--Start authentication section-->
<section class="auth-container">

    <div class="auth-box">

        <h2>Create Account</h2>

        <form id="signUp">
           <div>
            <input type="text" placeholder="Full name"  id="name">
            <small></small>
           </div>
            
           <div>
            <input type="email" placeholder="Email"  id="email">
            <small></small>
           </div>
            
           <div>
            <input type="password" placeholder="Password"  id="password">
            <small></small>
           </div>
            
           <div>
            <input type="password" placeholder="Confirm password"  id="confirm-password">
            <small></small>
           </div>
            

            <button type="submit">Signup</button>
        </form>

        <p>Already have an account? <a href="Login.html">Login</a></p>

    </div>

</section>

<!--End authentication section-->


        <script src="js/formvalidation.js"></script>
    </body>
</html>
